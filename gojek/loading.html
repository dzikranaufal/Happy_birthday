<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
/>

<title>Finding Driver</title>

<style>
    @font-face {
        font-family: 'Maison Neue';
        src: url('./fonts/fornts.com-Maison_Neue_Light.ttf') format('truetype');
        font-weight: 300;
    }

    @font-face {
        font-family: 'Maison Neue';
        src: url('./fonts/fornts.com-Maison_Neue_Book.ttf') format('truetype');
        font-weight: 400;
    }

    @font-face {
        font-family: 'Maison Neue';
        src: url('./fonts/fornts.com-Maison_Neue_Bold.ttf') format('truetype');
        font-weight: 700;
    }

    @font-face {
        font-family: 'Maison Neue Extended';
        src: url('./fonts/MaisonNeue-ExtendedBook.ttf') format('truetype');
    }

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        -webkit-tap-highlight-color:transparent;
    }

    html,
    body{
        width:100%;
        height:100%;
        overflow:hidden;
        font-family: 'Maison Neue', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background:#00A312;
    }

    .app{
        width:100%;
        max-width:390px;
        height:100dvh;
        margin:0 auto;
        background:#00A312;
        position:relative;
        overflow:hidden;

        display:flex;
        align-items:center;
        justify-content:center;
        flex-direction:column;
    }

    /* =========================
       RIPPLE AREA
    ========================== */

    .pulse-wrapper{
        position:relative;
        width:300px;
        height:280px;

        display:flex;
        align-items:center;
        justify-content:center;
    }

    .ripple{
        position:absolute;
        border-radius:50%;
        background:rgba(67, 192, 65, 0.45);

        animation:rippleAnim 3s infinite ease-out;
    }

    .ripple.one{
        width:180px;
        height:180px;
    }

    .ripple.two{
        width:180px;
        height:180px;
        animation-delay:1.2s;
    }

    .ripple.three{
        width:180px;
        height:180px;
        animation-delay:2.4s;
    }

    @keyframes rippleAnim{
        0%{
            transform:scale(0.6);
            opacity:0.75;
        }

        100%{
            transform:scale(3.5);
            opacity:0;
        }
    }

    /* =========================
       CENTER ICON
    ========================== */

    .center-circle{
        width:170px;
        height:170px;

        border-radius:50%;
        background:#FFFFFF;

        z-index:10;

        display:flex;
        align-items:center;
        justify-content:center;

        overflow:hidden;

        animation:beat 1.4s infinite ease-in-out;
    }

    @keyframes beat{
        0%{
            transform:scale(1);
        }

        50%{
            transform:scale(1.08);
        }

        100%{
            transform:scale(1);
        }
    }

    .center-circle img{
        width:100%;
        height:100%;
        object-fit:cover;
        display:none;
    }

    .center-circle.show-image{
        background:#FFFFFF;
    }

    .center-circle.show-image img{
        display:block;
    }

    /* =========================
       TEXT
    ========================== */

    .loading-text{

        font-size:24px;
        font-weight:700;
        color:#FFFFFF;

        text-align:center;

        width:85%;
        line-height:1.3;
    }

    .dots{
        text-align:left;
    }

</style>
</head>

<body>

<div class="app">

    <!-- RIPPLE -->
    <div class="pulse-wrapper">

        <div class="ripple one"></div>
        <div class="ripple two"></div>
        <div class="ripple three"></div>

        <!-- CENTER -->
        <div class="center-circle" id="centerCircle">

            <!-- OPTIONAL IMAGE -->
            <img src="" id="centerImg" />

        </div>

    </div>

    <!-- TEXT -->
    <div class="loading-text">
        <span id="loadingMessage"></span>
        <span class="dots" id="dots"></span>
    </div>

</div>

<script>
    const destinationType =
        localStorage.getItem('destinationType');
    /*
    ==========================================
    CUSTOM TEXT LIST
    ==========================================
    image: true = show image
    image: false = white circle
    */

    const loadingSteps = [

        {
            text: "Lagi cari driver terdekat",
            image: false
        },

        {
            text: "Hampir dapet nih",
            image: false
        },

        {
            text: "Driver ditemukan",
            image: "assets/soobin.png"
        },

        {
            text: "Dih ngarep",
            image: false
        },

        {
            text: "Dapet nih beneran",
            image: false
        },

        {
            text: "Gila cakep drivernya",
            image: "assets/gw.png"
        }

    ];

    /*
    ==========================================
    CONFIG
    ==========================================
    */

    const CHANGE_INTERVAL = 6000;

    /*
    ==========================================
    ELEMENTS
    ==========================================
    */

    const loadingMessage = document.getElementById("loadingMessage");
    const dots = document.getElementById("dots");
    const centerCircle = document.getElementById("centerCircle");
    const centerImg = document.getElementById("centerImg");

    let currentIndex = 0;

    /*
    ==========================================
    DOT ANIMATION
    ==========================================
    */

    let dotCount = 0;

    setInterval(() => {

        dotCount++;

        if(dotCount > 3){
            dotCount = 0;
        }

        dots.textContent = ".".repeat(dotCount);

    }, 500);

    function updateStep(){

        const step = loadingSteps[currentIndex];

        loadingMessage.textContent = step.text;

        /*
        ======================
        IMAGE TOGGLE
        ======================
        */

        if(step.image){

            centerCircle.classList.add("show-image");

            /*
            IF IMAGE STRING
            */
            if(typeof step.image === "string"){

                centerImg.src = step.image;

            }

        } else {

            centerCircle.classList.remove("show-image");

        }
    }

    /*
    ==========================================
    START
    ==========================================
    */

    updateStep();

    /*
    ==========================================
    CHANGE EVERY 6 SECONDS
    ==========================================
    */

    const stepInterval = setInterval(() => {

        currentIndex++;

        /*
        ======================
        FINISH -> NEXT PAGE
        ======================
        */

        if(currentIndex >= loadingSteps.length){

            clearInterval(stepInterval);

            /*
            CHANGE PAGE
            */

            window.location.href = "success.html";

            return;
        }

        updateStep();

    }, CHANGE_INTERVAL);

</script>

</body>
</html>
