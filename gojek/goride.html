<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GoRide</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <style>
        @font-face {
            font-family: 'Maison Neue';
            src: url('./fonts/fornts.com-Maison_Neue_Light.ttf') format('truetype');
            font-weight: 300;
        }

        @font-face {
            font-family: 'Maison Neue';
            src: url('./fonts/fornts.com-Maison_Neue_Book.ttf') format('truetype');
            font-weight: 400;
        }

        @font-face {
            font-family: 'Maison Neue';
            src: url('./fonts/fornts.com-Maison_Neue_Bold.ttf') format('truetype');
            font-weight: 700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

       html,
        body {
            font-family: 'Maison Neue', sans-serif;
            min-height: 100%;
            background: #F5F5F5;
        }

        .app-container {
            width: 100%;
            max-width: 390px;
            min-height: 100dvh;
            margin: 0 auto;
            overflow-x: hidden;
            position: relative;

            background:
                url("assets/background.png") top center / 100% auto no-repeat,
                #F5F5F5;
        }

        /* ===== HERO ===== */
        .hero-section {
            width: 100%;
            padding: 20px 18px 0;
            background: transparent;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #FFFFFF;
            border: none;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 24px;
            color: #111111;

            cursor: pointer;
        }

        .hero-img {
            width: 110px;
            height: 110px;

            margin: 28px auto 0;

            display: flex;
            align-items: center;
            justify-content: center;

            color: rgba(255,255,255,0.4);
            font-size: 24px;
        }

        .hero-title {
            margin-top: 32px;

            font-size: 26px;
            line-height: 1.15;
            font-weight: 700;

            text-align: center;
            color: #FFFFFF;
        }

        .hero-subtitle {
            margin-top: 8px;

            font-size: 18px;
            font-weight: 700;

            text-align: center;
            
            color: #FFFFFF;
        }

        /* ===== MAIN CARD ===== */
        .main-wrapper {
            margin-top: 42px;

            background: #00B014;

            border-radius: 28px 28px 0 0;

            padding-top: 20px;
        }

        /* ===== PROMO ===== */
        .promo-box {
            padding: 0 22px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .promo-icon {
            width: 38px;
            height: 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 30px;

            flex-shrink: 0;

            margin-bottom: 18px;
        }

        .promo-content {
            color: white;
        }

        .promo-title {
            font-size: 15px;
            font-weight: 700;
        }

        .promo-desc {
            margin-top: 2px;

            font-size: 14px;
            line-height: 1.45;
            font-weight: 400;
        }

        /* ===== CONTENT ===== */
        .content-card {
            background: white;

            border-radius: 28px 28px 0 0;

            padding: 18px 18px 40px;

            min-height: 780px;
        }

        .banner-img {
            width: 100%;
            height: 160px;

            background: #D9D9D9;

            border-radius: 22px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
            overflow: hidden;
        }

        .banner-img img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 22px;

            display: block;
        }

        /* ===== SEARCH ===== */
        .search-box {
            margin-top: 18px;

            width: 100%;
            height: 56px;

            border-radius: 999px;

            border: 1.6px solid #BDBDBD;

            background: #F5F5F5;

            display: flex;
            align-items: center;

            padding: 0 12px;

            gap: 16px;
        }

        .search-icon {
            width: 30px;
            height: 30px;

            border-radius: 50%;

            background: #F57C00;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 16px;

            flex-shrink: 0;
        }

        .search-input {
            flex: 1;

            border: none;
            outline: none;

            background: transparent;

            font-size: 15px;
            font-weight: 400;

            color: #111111;

            font-family: 'Maison Neue', sans-serif;
        }

        .search-input::placeholder {
            color: #B8B8B8;
        }

        /* ===== QUICK BUTTON ===== */
        .quick-actions {
            margin-top: 18px;

            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 12px;
        }

        .quick-btn {
            height: 50px;

            border-radius: 18px;

            border: 2px solid #BDBDBD;

            background: #FFFFFF;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }

        .quick-btn i {
            font-size: 20px;
            color: #B7B7B7;
        }

        /* ===== LOCATION LIST ===== */
        .location-list {
            margin-top: 34px;
        }

        .location-btn {
            width: 100%;

            background: transparent;
            border: none;

            padding: 20px 0;

            display: flex;
            align-items: center;

            gap: 20px;

            cursor: pointer;

            border-top: 5px solid #E7E7E7;
        }

        .location-btn:first-child {
            border-top: 5px solid #E7E7E7;
        }

        .clock-circle {
            width: 42px;
            height: 42px;

            border-radius: 50%;

            background: #C8C8C8;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 18px;

            flex-shrink: 0;
        }

        .location-text {
            font-size: 14px;
            font-weight: 700;

            color: #111111;

            text-align: left;
        }

        .location-btn:active {
            opacity: 0.7;
        }

        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .content-card {
                padding-bottom: calc(40px + env(safe-area-inset-bottom));
            }
        }
    </style>
</head>

<body>

    <div class="app-container">

        <!-- HERO -->
        <section class="hero-section">

            <button class="back-btn" onclick="history.back()">
                <i class="fa-solid fa-arrow-left"></i>
            </button>

            <div class="hero-img">
            </div>

            <div class="hero-title">
                Gimana harimu, Cantik?
            </div>

            <div class="hero-subtitle">
                Kuat terus ya! Sayang kamu!
            </div>

            <!-- MAIN -->
            <div class="main-wrapper">

                <!-- PROMO -->
                <div class="promo-box">

                    <div class="promo-icon">
                        <i class="fa-solid fa-shield-heart"></i>
                    </div>

                    <div class="promo-content">

                        <div class="promo-title">
                            Lebih aman pakai 1 motor
                        </div>

                        <div class="promo-desc">
                            Voucher Birthday treatment hanya berlaku s.d. hari h kamu ulang tahun!
                        </div>

                    </div>

                </div>

                <!-- CONTENT -->
                <div class="content-card">

                    <!-- BANNER -->
                    <div class="banner-img">
                        <img src="assets/map.png" alt="" width="100%">
                    </div>

                    <!-- SEARCH -->
                    <div class="search-box">

                        <div class="search-icon">
                            <i class="fa-solid fa-location-dot"></i>
                        </div>

                        <input
                            type="text"
                            class="search-input"
                            placeholder="Cari lokasi tujuan"
                        />

                    </div>

                    <!-- QUICK -->
                    <div class="quick-actions">

                        <button class="quick-btn">
                            <i class="fa-solid fa-bookmark"></i>
                            Simpan Rumah
                        </button>

                        <button class="quick-btn">
                            <i class="fa-solid fa-bookmark"></i>
                            Simpan Kantor
                        </button>

                    </div>

                    <!-- LOCATION LIST -->
                    <div class="location-list">

                        <button class="location-btn" onclick="selectDestination('Bioskop')">

                            <div class="clock-circle">
                                <i class="fa-regular fa-clock"></i>
                            </div>

                            <div class="location-text">
                                Bioskop
                            </div>

                        </button>

                        <button class="location-btn" onclick="selectDestination('Cafe')">

                            <div class="clock-circle">
                                <i class="fa-regular fa-clock"></i>
                            </div>

                            <div class="location-text">
                                Cafe
                            </div>

                        </button>

                        <button class="location-btn" onclick="window.location.href='location3.html'">

                            <div class="clock-circle">
                                <i class="fa-regular fa-clock"></i>
                            </div>

                            <div class="location-text">
                                Tembok Ratapan Solo
                            </div>

                        </button>

                    </div>

                </div>

            </div>

        </section>

    </div>
    <script>

    function selectDestination(type){

        if(type === 'Bioskop'){

            localStorage.setItem('destinationType', 'Bioskop');

        }

        if(type === 'Cafe'){

            localStorage.setItem('destinationType', 'Cafe');

        }

        window.location.href = 'location.html';

    }

    </script>
</body>
</html>
